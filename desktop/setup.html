<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>欢迎使用星笺</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <main>
    <div class="brand">星笺 <span>学术审稿 agent</span></div>
    <h1>从你的研究开始。</h1>
    <p class="intro">创建本机账号，保存论文、对话和评审记录。</p>
    <form id="setup">
      <label for="username">账号</label>
      <input id="username" name="username" autocomplete="username" minlength="3" maxlength="40" required placeholder="3–40 位中文、字母、数字或 ._-" autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required placeholder="至少 10 个字符">
      <label for="confirmation">确认密码</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="10" maxlength="128" required placeholder="再次输入密码">
      <div id="legacy" hidden>
        <label for="workspace">接续旧版数据</label>
        <select id="workspace" name="workspace"></select>
        <p class="hint">选中的工作空间将绑定到这个账号，其他空间仍会保留。</p>
      </div>
      <p id="error" role="alert"></p>
      <button type="submit" id="submit" disabled>创建账号并进入</button>
    </form>
    <p class="privacy">账号和文件保存在本机。使用 AI 时，相关内容会发送到你配置的模型服务。</p>
  </main>
  <script type="module" src="setup-renderer.js"></script>
</body>
</html>
